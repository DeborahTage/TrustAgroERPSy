# Persist local data on disk so records survive backend restarts.
spring.datasource.url=jdbc:h2:file:./data/trust_agro_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev-only JWT secret (never use in production)
app.jwt.secret=LocalDevOnlyTrustAgroJwtSecretKeyMustBeLongEnough123

# Seed demo users for local development only
app.seed.demo-users=true

# Seed demo master data for local development workflows
app.seed.demo-master-data=true

# Seed default HR reference data for local development
app.seed.hr-reference-data=true

# Allow localhost + LAN frontends during local development
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*
