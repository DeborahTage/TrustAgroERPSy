spring.application.name=trust-agro-backend

# Production is the safe default; explicitly select local for H2 and demo data.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Database (Postgres defaults for non-local; local profile overrides to H2)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trust_agro_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (conservative defaults)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — never hardcode; local/test profiles supply a dev-only secret
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration=86400000

# Server
server.port=${SERVER_PORT:8081}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Demo user seeding (local only; see application-local.properties)
app.seed.demo-users=false

# Demo master-data seed (local only; default false)
app.seed.demo-master-data=false

# Optional HR reference-data seed (local only; default false)
app.seed.hr-reference-data=false

# Alerts
app.alerts.mortality-threshold=1.0
app.alerts.daily-mortality-rate=1.0
app.alerts.expiry-warning-days=30
app.alerts.vaccination-due-days=3
app.upload.dir=${UPLOAD_DIR:./uploads}

# Actuator (local + shared)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.trustagro=INFO
