# Production profile — REQUIRED env vars (fail-fast via ProductionConfigValidator):
#   APP_JWT_SECRET          (>= 32 chars)
#   DB_URL
#   DB_USERNAME
#   DB_PASSWORD
#   APP_CORS_ALLOWED_ORIGINS  (explicit origins; never sole "*")

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

app.seed.demo-users=false

# Tighten pool slightly for typical single-instance deploy
spring.datasource.hikari.maximum-pool-size=15

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

logging.level.root=WARN
logging.level.com.trustagro=INFO

server.error.include-stacktrace=never
server.error.include-message=never
