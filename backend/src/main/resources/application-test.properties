# Maven / CI test profile
spring.datasource.url=jdbc:h2:mem:trust_agro_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=false

app.jwt.secret=TestOnlyTrustAgroJwtSecretKeyMustBeLongEnough12345
app.seed.demo-users=false
app.seed.demo-master-data=false
app.seed.hr-reference-data=false

app.cors.allowed-origins=http://localhost:3000
