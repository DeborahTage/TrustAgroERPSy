name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: trust_agro_real_pg_test
          POSTGRES_USER: real_pg_ci
          POSTGRES_PASSWORD: real_pg_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U real_pg_ci -d trust_agro_real_pg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and package backend
        working-directory: backend
        env:
          REAL_POSTGRES_JDBC_URL: jdbc:postgresql://localhost:5432/trust_agro_real_pg_test
          REAL_POSTGRES_USERNAME: real_pg_ci
          REAL_POSTGRES_PASSWORD: real_pg_ci_only_password
        run: mvn -B test package -Dmaven.repo.local=$HOME/.m2/repository

      - name: Verify real PostgreSQL test execution
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("target/surefire-reports/TEST-com.trustagro.schema.RealPostgresVerificationTest.xml")
          if not report.is_file():
              raise SystemExit(f"Missing Surefire report: {report}")

          suite = ElementTree.parse(report).getroot()
          tests = int(suite.attrib.get("tests", "0"))
          skipped = int(suite.attrib.get("skipped", "0"))
          failures = int(suite.attrib.get("failures", "0"))
          errors = int(suite.attrib.get("errors", "0"))
          print(f"RealPostgresVerificationTest: tests={tests}, skipped={skipped}, failures={failures}, errors={errors}")
          if (tests, skipped, failures, errors) != (20, 0, 0, 0):
              raise SystemExit("Real PostgreSQL integration test must execute all twenty tests without skips or failures")
          PY

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: CI=true npm test -- --watchAll=false --coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Build frontend for production
        working-directory: frontend
        run: CI=true npm run build

      - name: Validate Docker Compose configuration
        env:
          DB_PASSWORD: ci-compose-validation-placeholder
          APP_JWT_SECRET: ci-compose-validation-jwt-placeholder-not-a-secret
        run: docker compose config --quiet

      - name: Build Docker images
        env:
          DB_PASSWORD: ci-compose-validation-placeholder
          APP_JWT_SECRET: ci-compose-validation-jwt-placeholder-not-a-secret
        run: docker compose build
