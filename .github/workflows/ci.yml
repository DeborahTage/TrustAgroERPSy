name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and package backend
        working-directory: backend
        run: mvn -B test package

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: CI=true npm test -- --watchAll=false --coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Build frontend for production
        working-directory: frontend
        run: CI=true npm run build

      - name: Validate Docker Compose configuration
        env:
          DB_PASSWORD: ci-compose-validation-placeholder
          APP_JWT_SECRET: ci-compose-validation-jwt-placeholder-not-a-secret
        run: docker compose config --quiet

      - name: Build Docker images
        env:
          DB_PASSWORD: ci-compose-validation-placeholder
          APP_JWT_SECRET: ci-compose-validation-jwt-placeholder-not-a-secret
        run: docker compose build
